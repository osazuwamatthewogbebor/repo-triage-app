name: CI


# When to run
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]


permissions:
  contents: read


# If pushed twice, cancel the older run
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


jobs:
  build:
    name: Typecheck, build, smoke test
    runs-on: ubuntu-latest

  
  steps:
    - name: Check out the code
      uses: actions/checkout@v6

    - name: Set up Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '22'
        cache: npm

    - name: Install dependencies
      run:  npm ci

    - name: Typecheck
      run:  npx tsc --noEmit

    - name: Build
      run:  npx run build

    - name: Smoke test the build CLI
      run:  node dist/index.js status